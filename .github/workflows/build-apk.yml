name: Compilar APK Android (GitHub Actions)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Obtener código fuente
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar dependencias del proyecto
        run: npm install

      - name: 🛠️ Compilar APK Release con Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          chmod -R +x ../node_modules/
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Subir APK a artefactos descargables en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: OCRAPP-Ecuador-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
